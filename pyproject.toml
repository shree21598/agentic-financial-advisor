[project]
name = "agentic-financial-advisor"
version = "0.1.0"
description = "Multi-agent financial advisor on Vertex AI + Gemini with Google ADK, LangGraph, MCP and RAG"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.0",
  "google-genai>=1.0",
  "langgraph>=0.4",
  "mcp>=1.9,<2",            # langchain/ADK MCP integrations still target the 1.x SDK
  "numpy>=1.26",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advisor*", "eval*"]

[tool.setuptools.package-data]
"advisor.rag" = ["corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
